<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angielski Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
/* Layout: one terminal-style column — progress tabs, giant question, terminal window with prompt */
:root{
  --bg:#0b0d10; --panel:#11141a; --line:#242a32; --fg:#dde1db; --dim:#6c7480;
  --blue:#4ea1ff; --green:#41d67c; --coral:#f2705b; --yellow:#f6c344;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:15px;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);border-radius:4px;padding:3px 8px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.tab.now{color:var(--fg);border-color:var(--fg)}
.tab.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.tab.meh{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.tab.zero{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%,transparent)}
.tab.bonus{border-style:dashed}
h1{margin:0;font-weight:800;font-size:clamp(22px,6vw,40px);line-height:1.08;min-height:2.16em;display:flex;align-items:flex-end;text-transform:uppercase;text-wrap:balance;letter-spacing:-.01em;overflow-wrap:anywhere}
h1 .red{color:var(--coral)}
.sub{color:var(--dim);font-size:13px;margin-top:-10px}
.sub b{color:var(--yellow);font-weight:700}
.term{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:13px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .tag{margin-left:auto;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px;white-space:nowrap}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;height:clamp(240px,45vh,440px)}
.log{flex:1;min-height:0;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.ln{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.p{color:var(--green)}
.err{color:var(--coral)}
.ok{color:var(--green)}
.info{color:var(--blue)}
.dim{color:var(--dim)}
.bad{color:var(--coral);text-decoration:underline 3px;text-underline-offset:4px;background:color-mix(in srgb,var(--coral) 18%,transparent)}
form{display:flex;align-items:center;gap:8px;margin-top:4px;flex:none}
.keys{display:flex;gap:4px;flex:none}
.keys button{padding:2px 8px;font-size:14px}
#answer{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:18px;caret-color:var(--green);padding:4px 0}
#answer::selection{background:var(--coral);color:var(--bg)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--fg)}
button:focus-visible,#answer:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.go{color:var(--bg);background:var(--green);border-color:var(--green);font-weight:700}
.pill{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:10px 16px;font-size:clamp(16px,4.5vw,22px);font-weight:700;align-self:center}
.pill span{color:var(--yellow)}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;color:var(--dim)}
details[open] summary{margin-bottom:10px}
textarea{width:100%;min-height:220px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;font:inherit;font-size:12.5px;padding:10px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.bar .tag + .tag{margin-left:0}
#timer{font-variant-numeric:tabular-nums}
#timer.low{color:var(--yellow);border-color:var(--yellow)}
#timer.out{color:var(--coral);border-color:var(--coral)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--dim);font-size:13px;align-self:flex-start}
.switch input{appearance:none;margin:0;width:38px;height:20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim)}
.switch input:checked{background:color-mix(in srgb,var(--green) 25%,transparent);border-color:var(--green)}
.switch input:checked::after{left:20px;background:var(--green)}
.switch input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.switch input::after{transition:left .15s}}
.msg{font-size:12.5px}
.pick{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;min-width:0}
select{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 10px;min-width:0;max-width:100%;cursor:pointer}
select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=file]{font:inherit;font-size:12px;color:var(--dim);max-width:100%}
.qgrp{display:flex;flex-direction:column;gap:3px}
.qgrp.done{opacity:.38}
.qgrp.done .bad{background:none}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.hist li{display:flex;flex-wrap:wrap;gap:4px 14px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.hist li:last-child{border-bottom:0}
.hist .when{color:var(--dim)}
.hist .pts{color:var(--green);font-weight:700}
.hist .set{color:var(--dim);margin-left:auto;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.qgrp{transition:opacity .4s}}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .25s}}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>


<div class="wrap">
  <label class="pick" id="pick" hidden>zestaw <select id="set"></select></label>
  <div class="tabs" id="tabs"></div>
  <h1><span id="q">…</span></h1>
  <div class="sub" id="sub"></div>

  <div class="term" id="term">
    <div class="bar">
      <span class="dot" style="background:var(--coral)"></span><span class="dot" style="background:var(--yellow)"></span><span class="dot" style="background:var(--green)"></span>
      <span class="t" id="who">uczen@english: ~</span><span class="tag" id="timer" hidden></span><span class="tag" id="score">0 pkt</span>
    </div>
    <div class="body">
      <div class="log" id="log"></div>
      <form id="form" autocomplete="off">
        <span class="p">$</span>
        <input id="answer" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Odpowiedź po angielsku" placeholder="wpisz po angielsku…">
        <span class="keys" id="keys" hidden></span>
      </form>
    </div>
  </div>

  <div class="actions" id="actions">
    <button type="button" id="hint" title="skrót: Tab w polu odpowiedzi">podpowiedź</button>
    <button type="button" id="skip">pokaż odpowiedź</button>
    <button type="button" id="restart">nowe losowanie</button>
  </div>

  <label class="switch"><input type="checkbox" role="switch" id="timerOn" checked> timer · 20 s na pytanie (połowa punktów po czasie)</label>
  <label class="switch"><input type="checkbox" role="switch" id="fillOn" checked> „pokaż odpowiedź” wpisuje ją w pole</label>

  <details id="histbox" open>
    <summary>historia (od otwarcia strony)</summary>
    <ul class="hist" id="hist"></ul>
  </details>

  <details id="cfg">
    <summary>zestaw pytań (JSON)</summary>
    <textarea id="json" spellcheck="false" aria-label="JSON z pytaniami"></textarea>
    <div class="row">
      <button type="button" class="go" id="load">wczytaj</button>
      <input type="file" id="file" accept=".json,application/json" aria-label="Plik JSON">
      <button type="button" id="reset" hidden>usuń własny zestaw</button>
      <span class="msg" id="jmsg"></span>
    </div>
  </details>
</div>

<script>
const SAMPLE = {
  group1: [
    {pl:"pies", en:"dog"}, {pl:"kot", en:"cat"}, {pl:"dom", en:"house"},
    {pl:"jabłko", en:"apple"}, {pl:"szkoła", en:"school"}, {pl:"czerwony", en:"red"},
    {pl:"książka", en:"book"}, {pl:"woda", en:"water"}, {pl:"przyjaciel", en:["friend","mate"]},
    {pl:"okno", en:"window"}, {pl:"zielony", en:"green"}, {pl:"mleko", en:"milk"},
    {pl:"samochód", en:"car"}, {pl:"ptak", en:"bird"}, {pl:"słońce", en:"sun"}
  ],
  group2: [
    {pl:"Mam na imię Ola.", en:["my name is ola","i am ola","i'm ola"]},
    {pl:"Lubię lody.", en:"i like ice cream"},
    {pl:"Gdzie jest mój plecak?", en:"where is my backpack"}
  ]
};
// domyślnie: ile pytań losować z grupy i ile punktów za odpowiedź (gdy grupa jest samą tablicą)
const DEFAULTS = { group1: {count:10, points:1}, group2: {count:1, points:2} };
// języki zestawów: pole z odpowiedzią nazywa się kodem języka ("en", "de"); keys = przyciski znaków pod ręką;
// cs = wielkość liter ma znaczenie (rzeczowniki w niemieckim)
const LANGS = {
  en: {title:"Angielski Terminal", who:"english", po:"po angielsku", na:"na angielski", keys:[], cs:false},
  de: {title:"Niemiecki Terminal", who:"deutsch", po:"po niemiecku", na:"na niemiecki", keys:["ä","ö","ü","ß"], cs:true}
};
// zamienniki do wpisania bez niemieckiej klawiatury
const ALT = {"ä":"ae", "ö":"oe", "ü":"ue", "ß":"ss", "Ä":"Ae", "Ö":"Oe", "Ü":"Ue"};
const $ = id => document.getElementById(id);
const store = {
  get(){ try{return localStorage.getItem("q")}catch(e){return null} },
  name(){ try{return localStorage.getItem("qname") || "własny zestaw"}catch(e){return "własny zestaw"} },
  set(v, name){ try{localStorage.setItem("q",v); localStorage.setItem("qname",name)}catch(e){} },
  // wybrany zestaw: plik z sets/ albo "" = własny
  choice(){ try{return localStorage.getItem("set")}catch(e){return null} },
  choose(v){ try{localStorage.setItem("set",v)}catch(e){} }
};

// mnożnik punktów wg liczby złych prób przed poprawną: 0 → 100%, 1 → 50%, 2 → 25%, 3+ → 0
const SCALE = [1, 0.5, 0.25];
// timer: sekundy na pytanie; na pierwszym pytaniu rundy odliczanie rusza od pierwszej wpisanej litery
const T_LIMIT = 20, T_MULT = 0.5;
// podpowiedź (przycisk albo Tab): wpisuje w pole HINT_STEP kolejnych znaków od pierwszego błędu,
// najdalej do HINT_MAX długości odpowiedzi; każda użyta mnoży punkty przez HINT_MULT
const HINT_STEP = 3, HINT_MAX = 2/3, HINT_MULT = 0.5;
let deadline = 0, tick = 0, timedOut = false, waitStart = false;
let data, round, i, tries, points, hints, grp, started, setLabel = "";
const history = [];

const low = s => LANGS[data?.lang]?.cs ? s : s.toLowerCase();
const norm = s => low(s).replace(/[’`]/g,"'").replace(/[.!?,]+$/,"").replace(/\s+/g," ").trim();
// tekst w nawiasach jest opcjonalny: "enter (your PIN)" → "enter your pin", "enter"; pierwszy wariant = pełny
const variants = s => s.split(/(\([^()]*\))/).reduce((out, part) => /^\(.*\)$/.test(part)
  ? out.flatMap(o => [o + part.slice(1,-1), o])
  : out.map(o => o + part), [""]);
const answers = item => { const a = item[data.lang]; return Array.isArray(a) ? a : [a]; };
const accepted = item => [...new Set(answers(item).flatMap(variants).map(norm))];
// najdłuższy wspólny początek odpowiedzi a i wpisu t: k = znaki odpowiedzi, j = znaki wpisu (ä może być wpisane jako ae itd.)
function match(a, t){
  let k = 0, j = 0;
  while(k < a.length && j < t.length){
    if(a[k] === t[j]){ k++; j++; }
    else if(ALT[a[k]] && t.startsWith(ALT[a[k]], j)){ j += ALT[a[k]].length; k++; }
    else break;
  }
  return {k, j};
}
const shuffle = a => { a=[...a]; for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]} return a };
const esc = s => s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// grupa: tablica pytań albo { count, points, questions: [...] }
function validate(d){
  if(!d || !d.group1) throw "Brak grupy group1.";
  const lang = d.lang ?? "en";
  if(!LANGS[lang]) throw `Nieznany język: ${lang} (dostępne: ${Object.keys(LANGS).join(", ")}).`;
  const out = {lang};
  for(const name of ["group1","group2"]){
    // group2 (bonusowa) jest opcjonalna
    const g = !d[name] ? {count: 0, questions: []} : Array.isArray(d[name]) ? {questions: d[name]} : d[name];
    const {count = DEFAULTS[name].count, points = DEFAULTS[name].points, questions} = g;
    if(!Array.isArray(questions) || (d[name] && questions.length < 1)) throw `${name}: potrzebna lista pytań (co najmniej 1).`;
    for(const it of questions) if(!it.pl || !it[lang]) throw `Każde pytanie musi mieć pola pl i ${lang}.`;
    if(!Number.isInteger(count) || count < 0) throw `${name}: count musi być liczbą całkowitą ≥ 0.`;
    if(typeof points !== "number" || !(points > 0)) throw `${name}: points musi być liczbą > 0.`;
    out[name] = {count, points, questions};
  }
  if(out.group1.count + out.group2.count < 1) throw "Runda musi mieć co najmniej 1 pytanie.";
  return out;
}

function newRound(){
  round = [
    ...shuffle(data.group1.questions).slice(0,data.group1.count).map(x=>({...x,bonus:false,points:data.group1.points})),
    ...shuffle(data.group2.questions).slice(0,data.group2.count).map(x=>({...x,bonus:true,points:data.group2.points}))
  ];
  round.forEach(r=>r.state="");
  i = 0; points = 0; grp = null; started = Date.now(); $("log").innerHTML = "";
  $("form").hidden = false; $("actions").hidden = false;
  show();
}

function show(){
  const r = round[i]; tries = 0; hints = 0;
  group();
  $("q").innerHTML = esc(r.pl.replace(/[.?!]$/,"")) + '<span class="red">' + (r.pl.match(/[.?!]$/)?.[0] || ".") + '</span>';
  $("sub").innerHTML = r.bonus ? `<b>pytanie bonusowe · ${r.points} pkt</b> · przetłumacz zdanie` : `przetłumacz ${LANGS[data.lang].na} · ${r.points} pkt`;
  $("answer").value = ""; $("answer").focus();
  tabs(); score(); armTimer();
}

function stopTimer(){ clearInterval(tick); tick = 0; waitStart = false; }
function armTimer(){
  stopTimer(); timedOut = false;
  const el = $("timer"); el.hidden = !$("timerOn").checked; el.className = "tag";
  if(el.hidden) return;
  if(i === 0){ waitStart = true; el.textContent = `⏱ ${T_LIMIT}s`; el.title = "odliczanie rusza od pierwszej wpisanej litery"; }
  else startTimer();
}
function startTimer(){
  waitStart = false; $("timer").title = ""; deadline = Date.now() + T_LIMIT*1000;
  tick = setInterval(drawTimer, 100); drawTimer();
}
function drawTimer(){
  const left = Math.max(0, Math.ceil((deadline - Date.now())/1000)), el = $("timer");
  el.textContent = `⏱ ${left}s`; el.classList.toggle("low", left <= 3 && left > 0);
  if(left > 0) return;
  stopTimer(); timedOut = true; el.textContent = "⏱ 0s"; el.classList.add("out");
  line(`⌛ czas minął — za to pytanie ${T_MULT*100}% punktów`, "err");
}

function tabs(){
  $("tabs").innerHTML = round.map((r,k)=>`<span class="tab ${k===i?"now":""} ${r.state} ${r.bonus?"bonus":""}">${k+1}${r.bonus?"★":""}</span>`).join("");
}
function score(){ $("score").textContent = points + " pkt"; }
function group(){ grp = document.createElement("div"); grp.className = "qgrp"; $("log").append(grp); }
function line(html, cls=""){ const d=document.createElement("div"); d.className="ln "+cls; d.innerHTML=html; (grp||$("log")).append(d); $("log").scrollTop=1e9; }

function check(e){
  e.preventDefault();
  const r = round[i], typed = norm($("answer").value);
  if(!typed) return;
  tries++;
  const ok = accepted(r);
  const ms = ok.map(a => ({a, ...match(a, typed)}));
  if(ms.some(m => m.k === m.a.length && m.j === typed.length)){
    stopTimer();
    const mult = (SCALE[tries-1] ?? 0) * HINT_MULT**hints * (timedOut ? T_MULT : 1);
    const pts = Math.round(r.points * mult * 1000)/1000;
    points = Math.round((points+pts)*1000)/1000; r.state = mult===1 ? "ok" : mult>0 ? "meh" : "zero";
    line(`<span class="p">$</span> ${esc(typed)}`);
    line(`✓ dobrze! +${pts} pkt`, "ok");
    grp.classList.add("done");
    next(); return;
  }
  // znajdź odpowiedź z najdłuższym wspólnym początkiem
  const bm = ms.reduce((b, m) => m.j >= b.j ? m : b), best = bm.j;
  const caseOnly = typed.length > best && typed[best].toLowerCase() === (bm.a[bm.k] || "").toLowerCase();
  const shown = typed.length > best
    ? esc(typed.slice(0,best)) + `<span class="bad">${esc(typed[best])}</span>` + esc(typed.slice(best+1))
    : esc(typed) + `<span class="bad">_</span>`;
  line(`<span class="p">$</span> ${shown}`);
  line(caseOnly ? `✗ wielkość litery: ${best+1}. (rzeczowniki wielką literą)` : typed.length > best ? `✗ pierwsza zła litera: ${best+1}.` : `✗ brakuje liter na końcu`, "err");
  const inp = $("answer"); inp.value = typed; inp.focus();
  inp.setSelectionRange(best, Math.min(best+1, typed.length));
  $("term").classList.remove("shake"); void $("term").offsetWidth; $("term").classList.add("shake");
}

function next(){
  i++;
  if(i < round.length){ setTimeout(show, 700); return; }
  setTimeout(()=>{
    tabs(); score(); stopTimer(); $("timer").hidden = true;
    const max = round.reduce((sum,r)=>sum+r.points, 0), wrong = round.filter(r=>r.state!=="ok");
    $("q").innerHTML = `Koniec<span class="red">!</span>`;
    $("sub").textContent = "";
    $("form").hidden = true; $("actions").hidden = true;
    history.unshift({end: new Date(), ms: Date.now()-started, points, max, set: setLabel}); renderHistory();
    group(); line(""); line(`wynik: ${points} / ${max} pkt`, "info");
    if(wrong.length){ line("do powtórki:", "dim"); wrong.forEach(r=>line(`  ${esc(r.pl)} → ${esc(accepted(r)[0])}`, "dim")); }
    else line("wszystko za pierwszym razem 🎉", "ok");
    const b = document.createElement("button"); b.className="go"; b.textContent="$ jeszcze raz"; b.style.marginTop="10px"; b.style.alignSelf="flex-start";
    b.onclick = newRound; $("log").append(b); b.focus();
  }, 700);
}

const pad = n => String(n).padStart(2,"0");
function renderHistory(){
  $("hist").innerHTML = history.length ? history.map(h => {
    const s = Math.round(h.ms/1000);
    return `<li><span class="when">${pad(h.end.getHours())}:${pad(h.end.getMinutes())}</span>`
      + `<span>⏱ ${Math.floor(s/60)}:${pad(s%60)}</span>`
      + `<span class="pts">${h.points} / ${h.max} pkt</span>`
      + `<span class="set">${esc(h.set)}</span></li>`;
  }).join("") : `<li class="dim">brak ukończonych rund</li>`;
}
renderHistory();

$("form").addEventListener("submit", check);
$("answer").addEventListener("input", () => { if(waitStart && $("answer").value) startTimer(); });
try{ $("timerOn").checked = localStorage.getItem("timer") !== "0" }catch(e){}
$("timerOn").onchange = () => {
  try{ localStorage.setItem("timer", $("timerOn").checked ? "1" : "0") }catch(e){}
  if(!$("form").hidden && round) armTimer(); else $("timer").hidden = true;
  $("answer").focus();
};
function hint(){
  const inp = $("answer"), typed = low(inp.value).replace(/[’`]/g,"'").replace(/\s+/g," ").trimStart();
  // odpowiedź z najdłuższym poprawnym początkiem; przy remisie pierwsza (pełna)
  let best = -1, a;
  for(const o of accepted(round[i])){ const {k} = match(o, typed); if(k>best){best=k; a=o} }
  const max = Math.floor(a.length * HINT_MAX);
  inp.focus();
  if(best >= max){ line(`podpowiedź działa do ${max}. znaku — dalej bez niej`, "dim"); return; }
  const len = Math.min(best + HINT_STEP, max); hints++;
  inp.value = a.slice(0, len); inp.setSelectionRange(len, len);
  if(waitStart) startTimer();
  line(`podpowiedź: ${esc(a.slice(0,len))}${"_".repeat(a.length-len)} (punkty ×${HINT_MULT**hints})`, "info");
}
$("hint").onclick = hint;
try{ $("fillOn").checked = localStorage.getItem("fill") !== "0" }catch(e){}
$("fillOn").onchange = () => {
  try{ localStorage.setItem("fill", $("fillOn").checked ? "1" : "0") }catch(e){}
  $("answer").focus();
};
$("answer").addEventListener("keydown", e => { if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); hint(); } });
$("skip").onclick = () => {
  const r = round[i], a = accepted(r)[0], inp = $("answer"), fill = $("fillOn").checked; r.state = "meh"; tries = 99;
  line(`odpowiedź: ${esc(a)} — ${fill ? "enter, żeby iść dalej" : "wpisz ją, żeby iść dalej"}`, "info");
  if(fill) inp.value = a;
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
};
$("restart").onclick = newRound;

function applyLang(){
  const L = LANGS[data.lang], inp = $("answer");
  document.title = L.title; $("who").textContent = `uczen@${L.who}: ~`;
  inp.placeholder = `wpisz ${L.po}…`; inp.setAttribute("aria-label", `Odpowiedź ${L.po}`); inp.lang = data.lang;
  $("keys").innerHTML = L.keys.map(c => `<button type="button" tabindex="-1">${c}</button>`).join("");
  $("keys").hidden = !L.keys.length;
}
// przyciski znaków: wstawiają znak w miejscu kursora, pole zostaje w fokusie
$("keys").onpointerdown = e => e.preventDefault();
$("keys").onclick = e => {
  const b = e.target.closest("button"), inp = $("answer"); if(!b) return;
  inp.setRangeText(b.textContent, inp.selectionStart, inp.selectionEnd, "end");
  inp.focus(); inp.dispatchEvent(new Event("input"));
};

function loadJSON(text, quiet, save=true, label="własny zestaw"){
  try{
    data = validate(JSON.parse(text)); setLabel = label; applyLang();
    $("json").value = JSON.stringify(data, null, 2);
    if(save){ store.set($("json").value, label); store.choose(""); fillSets(""); }
    if(!quiet) $("jmsg").innerHTML = `<span class="ok">wczytano ${esc(label)}: losowane ${Math.min(data.group1.count,data.group1.questions.length)} z ${data.group1.questions.length} + ${Math.min(data.group2.count,data.group2.questions.length)} z ${data.group2.questions.length} pytań</span>`;
    newRound(); return true;
  }catch(err){
    $("jmsg").innerHTML = `<span class="err">${esc(typeof err==="string"?err:"Niepoprawny JSON: "+err.message)}</span>`;
    return false;
  }
}
$("load").onclick = () => loadJSON($("json").value);
$("file").onchange = e => { const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>loadJSON(fr.result, false, true, f.name); fr.readAsText(f); };

// zestawy z sets/index.json; kolejność: ?set=nazwa (sets/nazwa.json) > zapamiętany wybór > własny zestaw > pierwszy ze spisu > przykład
let SETS = [];
const fallback = () => loadJSON(JSON.stringify(SAMPLE), true, false, "przykład");
const fromRepo = f => fetch("sets/" + encodeURIComponent(f), {cache:"no-store"})
  .then(r => { if(!r.ok) throw 0; return r.text(); })
  .then(t => { if(!loadJSON(t, true, false, SETS.find(s=>s.file===f)?.name || f)) throw 0; });
function fillSets(cur){
  $("set").innerHTML = SETS.map(s=>`<option value="${esc(s.file)}">${esc(s.name)}</option>`).join("")
    + (store.get() ? `<option value="">${store.name()==="własny zestaw" ? "własny zestaw" : "własny: "+esc(store.name())}</option>` : "");
  $("set").value = cur; $("pick").hidden = !$("set").options.length; $("reset").hidden = !store.get();
}
function openSet(v){
  if(v === "") loadJSON(store.get(), true, false, store.name()) || fallback();
  else if(v) fromRepo(v).catch(fallback);
  else fallback();
}
$("set").onchange = () => { const v = $("set").value; store.choose(v); window.history.replaceState(null, "", location.pathname); openSet(v); };
fetch("sets/index.json", {cache:"no-store"}).then(r => { if(!r.ok) throw 0; return r.json(); }).catch(() => []).then(list => {
  SETS = Array.isArray(list) ? list.filter(s => s && s.file).map(s => ({file: String(s.file), name: String(s.name || s.file)})) : [];
  const url = new URLSearchParams(location.search).get("set"), c = store.choice();
  let cur;
  if(url){ cur = url + ".json"; if(!SETS.some(s=>s.file===cur)) SETS.push({file:cur, name:url}); }
  else cur = c && SETS.some(s=>s.file===c) ? c : store.get() ? "" : SETS[0]?.file;
  fillSets(cur ?? ""); openSet(cur);
});
$("reset").onclick = () => { try{["q","qname","set"].forEach(k=>localStorage.removeItem(k))}catch(e){} location.reload(); };
</script>
